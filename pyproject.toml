[project]
name = "repo-debug-agent"
version = "0.1.0"
description = "Repo-Aware Autonomous Debugging Agent with Paritok token optimization"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
    "GitPython>=3.1.43",
    "PyGithub>=2.3.0",
    "tree-sitter>=0.20.4",
    "tree-sitter-languages>=1.10.2",
    "pathspec>=0.12.1",
    "networkx>=3.3",
    "sentence-transformers>=3.0.1",
    "faiss-cpu>=1.8.0",
    "chromadb>=0.5.5",
    "openai>=1.40.0",
    "pytest-json-report>=1.5.0",
    "tiktoken>=0.7.0",
    "langgraph>=0.2.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

paritok = [
    "paritok[proxy]>=1.2.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]